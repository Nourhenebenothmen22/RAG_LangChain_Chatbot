[project]
name = "rag-langchain-chatbot"
version = "0.1.0"
description = "High-performance database-driven Hybrid RAG pipeline with LangChain, LangSmith, and Cross-Encoder reranking"
readme = "README.md"
authors = [
    { name = "Nourhene Ben Othmen", email = "benothmennourhen8@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=0.1.0",
    "langchain-text-splitters>=1.1.3",
    "langsmith>=0.1.0",
    "numpy>=2.4.6",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "langserve>=0.3.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
rag-langchain-chatbot = "rag_langchain_chatbot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
