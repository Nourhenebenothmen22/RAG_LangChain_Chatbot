[project]
name = "rag-langchain-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nourhene Ben Othmen", email = "benothmennourhen8@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langserve[all]>=0.3.3",
    "numpy>=2.4.6",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
rag-langchain-chatbot = "rag_langchain_chatbot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
